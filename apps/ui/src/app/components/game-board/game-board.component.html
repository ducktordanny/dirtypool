<dp-match-hud [game]="game()" [names]="names()" [clock]="clock()" />
<div class="arena">
  <div class="controls">
    <dp-power-slider
      [disabled]="!interactive()"
      (powerChange)="power.set($event)"
      (release)="pool.fire($event)"
    />
    <dp-spin-control [(spin)]="spin" [disabled]="!interactive()" />
  </div>
  <div class="stage">
    <dp-pool-table
      #pool
      [table]="table()"
      [interactive]="interactive()"
      [power]="power()"
      [spin]="spin()"
      [remoteAim]="remoteAim()"
      [remoteShot]="remoteShot()"
      [legalTargets]="legalTargets()"
      [ballInHand]="ballInHand()"
      [placingTrap]="placingTrap()"
      [placingDirection]="placingDirection()"
      [placingGroup]="placingGroup()"
      (shot)="onShot($event)"
      (trapPlace)="onTrapPlace($event)"
      (aimChange)="aim.emit($event)"
      (cueMove)="cueMove.emit($event)"
      (cuePlace)="cuePlace.emit($event)"
    />
    <dp-outcome-banner [announcement]="announcement()" />
    <ng-content select="[boardOverlay]" />
    @if (result(); as result) {
      <dp-match-result
        [winnerName]="result.winnerName"
        [celebrate]="result.celebrate"
        [detail]="result.detail"
        (restart)="restart.emit()"
      />
    }
  </div>
  <dp-ball-tray [balls]="trayBalls()" />
  <dp-trap-tray
    class="pouch"
    [(selected)]="placingTrap"
    [trapsLeft]="trapsLeft()"
    [disabled]="!canPlaceTrap()"
    [turnable]="canTurn()"
    [turnLabel]="turnLabel()"
    (turn)="turnTrap()"
  >
    <dp-help-tip>
      Pick a trap from the pouch and tap the cloth to drop it; R turns walls and fans and swaps a
      magnet's group. Drag on the table to aim, tap the cue ball for spin, pull the power bar and
      let go to shoot.
    </dp-help-tip>
  </dp-trap-tray>
</div>
