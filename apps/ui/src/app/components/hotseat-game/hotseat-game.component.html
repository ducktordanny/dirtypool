<dp-game-board
  [game]="game.game()"
  [table]="game.table()"
  [interactive]="game.canShoot()"
  [clock]="game.clock()"
  [announcement]="game.lastShot()"
  (shot)="shoot($event)"
  (cueMove)="game.moveCueBall($event)"
  (cuePlace)="game.placeCueBall($event)"
  (trapPlace)="game.placeTrap($event)"
  (restart)="newGame()"
/>
<div class="footer">
  <p class="hint">
    Pick a trap from the pouch and tap the cloth to drop it. Drag on the table to aim, tap the cue
    ball for spin, pull the power bar and let go to shoot.
  </p>
  <dp-button (click)="newGame()">New game</dp-button>
</div>
