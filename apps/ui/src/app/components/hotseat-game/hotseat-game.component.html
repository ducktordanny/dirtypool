<dp-game-board
  [game]="game.game()"
  [table]="game.table()"
  [interactive]="game.canShoot()"
  [clock]="game.clock()"
  (shot)="shoot($event)"
/>
<div class="footer">
  <p class="hint">Drag on the table to aim, pull the power bar and let go to shoot.</p>
  <dp-button (click)="newGame()">New game</dp-button>
</div>
