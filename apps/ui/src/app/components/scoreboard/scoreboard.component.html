<div class="players">
  @for (player of players(); track player.label) {
    <div
      class="player"
      [class.player--active]="player.active"
      [class.player--winner]="player.winner"
    >
      <span class="player__label">{{ player.label }}</span>
      <span class="player__score">{{ player.score }}</span>
    </div>
  }
</div>
<p class="message">{{ message() }}</p>
