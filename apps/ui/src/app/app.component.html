<header class="header">
  <a class="title" routerLink="/">Dirty Pool</a>
  <div class="actions">

      <ng-container [ngTemplateOutlet]="actions" />
    }
    <dp-sound-toggle [muted]="audio.muted()" (toggled)="audio.toggleMuted()" />
  </div>
</header>
<main class="main">
  <router-outlet />
</main>
